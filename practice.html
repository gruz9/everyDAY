<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인 공부 사이트</title>
    <link rel="stylesheet" href="practice.css">
</head>
<body>
    <header>
        <h1>공부 기록장</h1>
    </header>

    <main>
        <section>
            <label for="study-topic">공부한 내용</label>
            <input id="study-topic" type="text"  name="study-topic">

            <label for="study-notes">배운 점</label>
            <textarea id="study-notes"></textarea>

            <button type="button">기록 추가하기</button>
        </section>
        <section>
            <h2>최근 공부 기록</h2>
            <article>
                <h3>HTML 기본 규정, CSS 작성</h3>
                <p>HTML의 기본 구조와 CSS를 사용하여 웹 페이지를 디자인하는 방법을 배웠습니다.</p>
            </article>
        </section>
    </main>

    <footer>
        <p>매일 공부하여 공부 기록 웹 사이트 만들기!</p>
    </footer>
</body>
</html>
